name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: InfoNeutre-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK (Release "derniere-version")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk InfoNeutre.apk
          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create derniere-version InfoNeutre.apk \
            --title "Info Neutre - dernière version" \
            --notes "APK compilé automatiquement depuis le commit ${{ github.sha }}."
