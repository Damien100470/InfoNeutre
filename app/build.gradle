plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.damien.infoneutre'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.damien.infoneutre'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.3'
        // Processeurs des téléphones Android (réduit la taille de l'APK)
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Traduction anglais -> français sur le téléphone (Google ML Kit, gratuit)
    implementation 'com.google.mlkit:translate:17.0.3'
}
