plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.damien.infoneutre'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.damien.infoneutre'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Aucune dépendance externe : uniquement le SDK Android.
